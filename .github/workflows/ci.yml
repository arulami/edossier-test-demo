# GitHub Actions equivalent of azure-pipelines.yml (runs as soon as you push to GitHub).
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pact, WireMock and SQL tests
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-contracts
          path: target/pacts

  serenity-api-tests:
    needs: fast-tests
    runs-on: ubuntu-latest
    services:
      petstore:
        image: swaggerapi/petstore3:unstable
        ports: [ "8080:8080" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for Petstore
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v3/openapi.json > /dev/null && exit 0; sleep 2; done; exit 1
      - name: Serenity REST + Screenplay/Cucumber (mvn verify)
        run: mvn -B verify
      - name: Bruno collection
        if: always()
        working-directory: bruno/petstore
        run: npx --yes @usebruno/cli@latest run --env local --reporter-junit ../../bruno-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-report
          path: target/site/serenity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-junit-results
          path: |
            target/failsafe-reports
            bruno-results.xml

  ui-tests:
    needs: serenity-api-tests
    runs-on: ubuntu-latest
    services:
      petstore:
        image: swaggerapi/petstore3:unstable
        ports: [ "8080:8080" ]
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          working-directory: cypress

  performance-smoke:
    needs: serenity-api-tests
    runs-on: ubuntu-latest
    services:
      petstore:
        image: swaggerapi/petstore3:unstable
        ports: [ "8080:8080" ]
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Wait for Petstore
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v3/openapi.json > /dev/null && exit 0; sleep 2; done; exit 1
      - name: k6 smoke load (thresholds fail the job)
        working-directory: k6
        run: k6 run -e PROFILE=smoke petstore-load.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: k6/results
