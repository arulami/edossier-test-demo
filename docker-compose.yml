# Local test environment:
#   petstore  - the system under test (an OpenAPI 3 REST API), http://localhost:8080/api/v3
#   influxdb  - stores k6 metrics (database "k6")
#   grafana   - k6 dashboard over those metrics, http://localhost:3000 (anonymous admin, demo only)
#   k6        - load-test runner; only starts when you call it:
#                 docker compose run --rm k6 run /scripts/petstore-load.js
services:
  petstore:
    image: swaggerapi/petstore3:unstable
    # The image is only published for Intel/AMD. On Apple Silicon (M1-M4) Docker Desktop runs it
    # through emulation (enable Rosetta in Docker Desktop for speed). Harmless on Intel/AMD machines.
    platform: linux/amd64
    container_name: petstore
    ports:
      - "8080:8080"

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/k6-petstore.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

  k6:
    image: grafana/k6:latest
    profiles: ["tools"]          # not started by "docker compose up"
    depends_on:
      - petstore
      - influxdb
    working_dir: /scripts
    environment:
      BASE_URL: http://petstore:8080/api/v3
      K6_OUT: influxdb=http://influxdb:8086/k6
    volumes:
      - ./k6:/scripts